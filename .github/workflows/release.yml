name: release

on:
  push:
    tags: ["v*"]

jobs:
  check-version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag must match version.sexp
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '"[:space:]' < version.sexp)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match version.sexp ($version)"
            exit 1
          fi

  build:
    needs: check-version
    uses: ./.github/workflows/build-static.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          chmod +x clicklisp-linux-*
          sha256sum clicklisp-linux-* > SHA256SUMS
          cat SHA256SUMS
      - name: Smoke test the x86_64 artifact
        run: |
          ./dist/clicklisp-linux-x86_64 version
          echo '(select (1))' | ./dist/clicklisp-linux-x86_64 compile
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/clicklisp-linux-x86_64 \
            dist/clicklisp-linux-aarch64 \
            dist/SHA256SUMS \
            --title "clicklisp $GITHUB_REF_NAME" \
            --generate-notes
