version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # click-ui has breaking prop changes between versions; upgrade manually
      - dependency-name: "@clickhouse/click-ui"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
